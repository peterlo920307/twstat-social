<title id="title">Tables with data, by year</title>
<desc id="desc">Stacked columns, 1895 to 1945, of how many of the 48 tables report each year, split into education, hygiene and welfare. None report 1895 or 1896. Coverage rises from 6 tables in 1897 to a plateau of about 47 in the 1930s and falls from 43 in 1942 to 15 in 1943. The counts are in coverage.csv.</desc>
