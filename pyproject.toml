[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twstat"
version = "0.1.0"
description = "Recover tidy data from legacy East Asian statistical tables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lo Yu Cheng" }]
keywords = ["digital humanities", "historical statistics", "taiwan", "data rescue", "spreadsheets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["pandas>=2.0", "xlrd>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/peterlo920307/twstat-social"
Issues = "https://github.com/peterlo920307/twstat-social/issues"

[project.scripts]
twstat = "twstat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twstat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --strict-markers"
markers = ["corpus: requires the source .xls files (run scripts/download_raw.py)"]
