[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twstat"
version = "0.1.0"
description = "Recover tidy data from legacy East Asian statistical tables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lo Yu Cheng" }]
keywords = ["digital humanities", "historical statistics", "taiwan", "data rescue", "spreadsheets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["pandas>=2.0", "xlrd>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "pandas-stubs"]

[project.urls]
Homepage = "https://github.com/peterlo920307/twstat-social"
Issues = "https://github.com/peterlo920307/twstat-social/issues"

[project.scripts]
twstat = "twstat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twstat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --strict-markers"
markers = ["corpus: requires the source .xls files (run scripts/download_raw.py)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D"]
# RUF001-003 flag full-width CJK punctuation as ambiguous. This package exists to
# handle exactly those characters, so the warnings are noise here.
ignore = ["D203", "D213", "D100", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/twstat/corpus1946.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# Checked against 3.12 because the numpy stubs use syntax newer than the
# minimum runtime version. The package itself still supports 3.10.
python_version = "3.12"
files = ["src/twstat"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
